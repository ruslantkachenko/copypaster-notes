name: Deploy to GitHub Pages

on:
  push:
    branches: [main, blog-layout-prototype, gif-attachment-path-fix, manual-blog-excerpts, fix-preview-marker-flow, homepage-image-preview-fix, fix-homepage-image-url, disable-recent-notes, fix-short-image-embed-paths]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Record site telemetry
        continue-on-error: true
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            EVENT="update"
          elif [[ "${{ github.event.head_commit.message }}" == "Initial publish from Obsidian" ]]; then
            EVENT="publish"
          else
            EVENT="update"
          fi
          curl -sS -f -X POST "https://github-publish-telemetry.o-rouiller.workers.dev/v1/event" \
            -H "Content-Type: application/json" \
            -d "{\"event\":\"$EVENT\"}"

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Clone Quartz engine
        run: |
          git clone --depth 1 https://github.com/jackyzha0/quartz.git quartz-engine
          cd quartz-engine
          git fetch --depth 1 origin 9cf87ff1c248a8ca551093214b0fec3b31415009
          git checkout 9cf87ff1c248a8ca551093214b0fec3b31415009

      - name: Restore Quartz dependency cache
        uses: actions/cache@v5
        id: quartz-deps-cache
        with:
          path: |
            quartz-engine/node_modules
            quartz-engine/.quartz/plugins
          key: quartz-deps-9cf87ff1c248a8ca551093214b0fec3b31415009-${{ hashFiles('quartz.lock.json', 'quartz/styles/custom.scss', 'site-plugins/blog-home/**', 'site-plugins/publish-path-fix/**', 'site-plugins/preview-boundary/**') }}
          restore-keys: |
            quartz-deps-9cf87ff1c248a8ca551093214b0fec3b31415009-

      - name: Overlay user site
        run: |
          # Point Quartz at the site checkout's content via -d so
          # CreatedModifiedDate discovers the wiki git history (not the engine's).
          # Expose the same folder as ./content so plugins can resolve frontmatter
          # images by filename, the way Obsidian does.
          rm -rf quartz-engine/content
          ln -s "$GITHUB_WORKSPACE/content" quartz-engine/content
          cp quartz.config.yaml quartz.lock.json quartz-engine/
          mkdir -p quartz-engine/quartz/styles
          cp quartz/styles/custom.scss quartz-engine/quartz/styles/custom.scss
          cp -R site-plugins quartz-engine/

      - name: Install dependencies
        if: steps.quartz-deps-cache.outputs.cache-hit != 'true'
        working-directory: quartz-engine
        run: npm ci

      - name: Install Quartz plugins
        if: steps.quartz-deps-cache.outputs.cache-hit != 'true'
        working-directory: quartz-engine
        run: npx quartz plugin install

      - name: Test manual blog previews
        working-directory: quartz-engine
        run: node --test site-plugins/blog-home/preview.test.js site-plugins/preview-boundary/preview-boundary.test.js

      - name: Build site
        working-directory: quartz-engine
        run: npx quartz build -d "$GITHUB_WORKSPACE/content"

      - name: Verify GIF attachment path
        working-directory: quartz-engine
        run: |
          HTML_FILE="$(grep -RIl 'Как будто, я чувствую звуковую волну.' public --include='*.html' | head -n 1)"
          if [[ -z "$HTML_FILE" ]]; then
            echo "Could not find the full GIF article HTML."
            exit 1
          fi
          if ! grep -q 'unknown_filename' "$HTML_FILE"; then
            echo "The GIF file reference was not found in the full article HTML."
            grep -o '.\\{0,120\\}Evernote/Published.\\{0,180\\}' "$HTML_FILE" | head -n 3 || true
            exit 1
          fi
          if grep -q 'Evernote/Published' "$HTML_FILE"; then
            echo "The original vault folder prefix remains in the published HTML."
            exit 1
          fi
          echo "GIF attachment link was normalized successfully: $HTML_FILE"

      - name: Verify manual preview boundary
        working-directory: quartz-engine
        run: |
          HOME_HTML="public/index.html"
          if ! grep -Fq 'Сразу оговорюсь' "$HOME_HTML"; then
            echo "The expected text before the manual preview marker is missing."
            exit 1
          fi
          if grep -Fq 'Вы, крепкий' "$HOME_HTML"; then
            echo "Text after the manual preview marker leaked into the homepage excerpt."
            exit 1
          fi
          echo "Homepage excerpt stops at the manual preview marker."
          if ! grep -Fq 'blog-post-excerpt-image' "$HOME_HTML" || ! grep -Fq 'unknown_filename-11.gif' "$HOME_HTML"; then
            echo "The image before the manual preview marker is missing from the homepage preview."
            exit 1
          fi
          echo "The image before the manual preview marker is present in the homepage preview."
          if ! grep -Fq './embedded/светофор.jpg' "$HOME_HTML"; then
            echo "The short wikilink for the traffic-light image did not resolve to embedded/."
            exit 1
          fi
          echo "The short image wikilink resolves to the embedded attachment."

      - uses: actions/upload-pages-artifact@v5
        with:
          path: quartz-engine/public

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
